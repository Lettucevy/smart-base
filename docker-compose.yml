services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbase_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbase_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-smartbase_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smartbase_user} -d $${POSTGRES_DB:-smartbase_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartbase-pgadmin
    restart: unless-stopped
    # Gera o arquivo pgpass (permissão 600) antes de iniciar o pgAdmin,
    # para que a conexão com o PostgreSQL abra sem pedir senha.
    entrypoint:
      - /bin/sh
      - -c
      - "echo 'postgres:5432:*:smartbase_user:smartbase_pass123' > /var/lib/pgadmin/pgpass && chmod 600 /var/lib/pgadmin/pgpass && exec /entrypoint.sh"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@smartbase.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres_data:
  pgadmin_data:
